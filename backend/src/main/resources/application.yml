server:
  port: 8080

spring:
  application:
    name: quickshop
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/quickshop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
    username: ${DB_USERNAME:quickshop}
    password: ${DB_PASSWORD:quickshop123}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  # Spring AI (OpenAI-compatible). Không có API key -> hệ thống tự dùng chế độ fallback, vẫn chạy bình thường.
  ai:
    openai:
      api-key: ${AI_API_KEY:none}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        completions-path: ${AI_COMPLETIONS_PATH:/v1/chat/completions}
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.7

app:
  jwt:
    secret: ${JWT_SECRET:quickshop-dev-secret-key-please-change-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}
  seed:
    enabled: ${SEED_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.rikkei.quickshop: INFO
