name: CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - build & test (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit + Integration tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon test 2>&1 | tee gradle-test.log
      - name: Report failures as annotations
        if: failure()
        run: |
          python3 - << 'PY'
          import glob, re, xml.etree.ElementTree as ET
          lines = []
          for f in glob.glob('build/test-results/test/*.xml'):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (fail.get('message') or '')[:600]
                      body = (fail.text or '')
                      cause = [l.strip() for l in body.splitlines() if 'Caused by' in l or 'Exception' in l][:4]
                      lines.append(f"{tc.get('classname').split('.')[-1]}.{tc.get('name')}: {msg} || {' | '.join(cause)[:900]}")
          if not lines:
              log = open('gradle-test.log', errors='ignore').read().splitlines()
              lines = [l for l in log if re.search(r'error:|FAILED|What went wrong|Exception|Caused by|\.java:\d+', l)][:60]
          for i in range(0, len(lines), 6):
              chunk = '%0A'.join(l.replace('%', '%25').replace('\r', '') for l in lines[i:i+6])
              print(f"::error title=Backend failure {i//6+1}::{chunk}")
          PY
      - name: Test summary
        if: always()
        run: |
          python3 - << 'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for x in glob.glob('build/test-results/test/*.xml'):
              r = ET.parse(x).getroot()
              t += int(r.get('tests')); f += int(r.get('failures')); e += int(r.get('errors')); s += int(r.get('skipped'))
          msg = f"Backend tests: {t} total, {t-f-e-s} passed, {f+e} failed, {s} skipped"
          print(f"::notice title=Backend test summary::{msg}")
          open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a').write('### ' + msg + '\n')
          PY
      - name: Build jar
        run: ./gradlew --no-daemon bootJar
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-report
          path: |
            backend/build/reports/tests/test
            backend/build/reports/jacoco/test/html
            backend/build/test-results/test

  frontend:
    name: Frontend - lint, test & build (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --reporter=default --reporter=json --outputFile=vitest-result.json
      - name: Test summary
        if: always()
        run: |
          node -e "const r=require('./vitest-result.json');console.log('::notice title=Frontend test summary::Frontend tests: '+r.numTotalTests+' total, '+r.numPassedTests+' passed, '+r.numFailedTests+' failed')"
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist

  integration:
    name: Docker Compose - smoke & load test (50 VUs)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build & start stack
        run: docker compose up -d --build
      - name: Wait for services healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health | grep -q UP && curl -sf http://localhost:3000/ > /dev/null; then
              echo "Stack is up after $((i*5))s"; exit 0
            fi
            sleep 5
          done
          docker compose ps; docker compose logs backend | tail -100; exit 1
      - name: Smoke test (E2E qua Nginx)
        run: |
          set -o pipefail
          bash scripts/smoke-test.sh | tee smoke.log
          echo "::notice title=Smoke test E2E::$(tail -1 smoke.log)"
      - name: Load test k6 - 50 concurrent users, p95 < 500ms
        run: |
          docker run --rm --network host -v "$PWD/tests/load:/scripts" grafana/k6:0.54.0 \
            run --summary-export=/scripts/k6-summary.json /scripts/products.js
      - name: k6 summary
        if: always()
        run: |
          node -e "const m=require('./tests/load/k6-summary.json').metrics;const d=m.http_req_duration;const r=m.http_reqs;const f=m.http_req_failed;console.log('::notice title=k6 load test (50 VUs, 30s)::requests='+r.count+' rps='+r.rate.toFixed(1)+' avg='+d.avg.toFixed(1)+'ms p90='+d['p(90)'].toFixed(1)+'ms p95='+d['p(95)'].toFixed(1)+'ms max='+d.max.toFixed(1)+'ms failed='+(f.value*100).toFixed(2)+'% checks='+(m.checks.value*100).toFixed(2)+'%')"
      - name: Lighthouse - First Contentful Paint (NFR-02)
        continue-on-error: true
        run: |
          npx --yes @lhci/cli@0.14.0 collect --url=http://localhost:3000/ --numberOfRuns=1 \
            --settings.preset=desktop --settings.chromeFlags="--no-sandbox --headless=new"
          node -e "const fs=require('fs');const d='.lighthouseci';const f=fs.readdirSync(d).find(x=>x.endsWith('.json')&&x.startsWith('lhr'));const r=JSON.parse(fs.readFileSync(d+'/'+f));const fcp=r.audits['first-contentful-paint'].numericValue;console.log('::notice title=Lighthouse (desktop)::FCP='+Math.round(fcp)+'ms LCP='+Math.round(r.audits['largest-contentful-paint'].numericValue)+'ms Performance='+Math.round(r.categories.performance.score*100)+' Accessibility='+Math.round(r.categories.accessibility.score*100));fs.writeFileSync('tests/load/lighthouse-fcp.txt','FCP='+Math.round(fcp)+'ms\nPerformance='+Math.round(r.categories.performance.score*100)+'\n');"
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-results
          path: |
            tests/load/k6-summary.json
            tests/load/lighthouse-fcp.txt
            .lighthouseci
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
