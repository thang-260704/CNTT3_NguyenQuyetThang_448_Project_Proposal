name: CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - build & test (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit + Integration tests
        run: ./gradlew --no-daemon test
      - name: Build jar
        run: ./gradlew --no-daemon bootJar
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            backend/build/reports/tests/test
            backend/build/reports/jacoco/test/html
            backend/build/test-results/test

  frontend:
    name: Frontend - lint, test & build (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  integration:
    name: Docker Compose - smoke & load test (50 VUs)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build & start stack
        run: docker compose up -d --build
      - name: Wait for services healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/actuator/health | grep -q UP && curl -sf http://localhost:3000/ > /dev/null; then
              echo "Stack is up after $((i*5))s"; exit 0
            fi
            sleep 5
          done
          docker compose ps; docker compose logs backend | tail -100; exit 1
      - name: Smoke test (E2E qua Nginx)
        run: bash scripts/smoke-test.sh
      - name: Load test k6 - 50 concurrent users, p95 < 500ms
        run: |
          docker run --rm --network host -v "$PWD/tests/load:/scripts" grafana/k6:0.54.0 \
            run --summary-export=/scripts/k6-summary.json /scripts/products.js
      - name: Lighthouse - First Contentful Paint (NFR-02)
        continue-on-error: true
        run: |
          npx --yes @lhci/cli@0.14.0 collect --url=http://localhost:3000/ --numberOfRuns=1 \
            --settings.preset=desktop --settings.chromeFlags="--no-sandbox --headless=new"
          node -e "const fs=require('fs');const d='.lighthouseci';const f=fs.readdirSync(d).find(x=>x.endsWith('.json')&&x.startsWith('lhr'));const r=JSON.parse(fs.readFileSync(d+'/'+f));const fcp=r.audits['first-contentful-paint'].numericValue;console.log('FCP =',Math.round(fcp),'ms');fs.writeFileSync('tests/load/lighthouse-fcp.txt','FCP='+Math.round(fcp)+'ms\nPerformance='+Math.round(r.categories.performance.score*100)+'\n');"
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            tests/load/k6-summary.json
            tests/load/lighthouse-fcp.txt
            .lighthouseci
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
